<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fondo ultra-oscuro -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E0E12" />
      <stop offset="50%" stop-color="#070709" />
      <stop offset="100%" stop-color="#030304" />
    </linearGradient>

    <!-- Resplandor holográfico radial naranja/ámbar (estilo FORJA) -->
    <radialGradient id="hologramGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FF5500" stop-opacity="0.32" />
      <stop offset="35%" stop-color="#FFAE19" stop-opacity="0.16" />
      <stop offset="70%" stop-color="#FF5500" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#070709" stop-opacity="0" />
    </radialGradient>

    <!-- Gradiente 3D para el texto PASAPORTE -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FFD452" />
      <stop offset="55%" stop-color="#FF7B00" />
      <stop offset="85%" stop-color="#E63900" />
      <stop offset="100%" stop-color="#8A1500" />
    </linearGradient>

    <!-- Filtro de brillo intenso neón -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Sombra 3D profunda para el texto -->
    <filter id="shadow3D" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#FF5500" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Fondo base -->
  <rect width="1200" height="480" fill="url(#bgGrad)" />

  <!-- Capa de brillo holográfico -->
  <rect width="1200" height="480" fill="url(#hologramGlow)" />

  <!-- Patrón de cuadrícula tecnológica sutil -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="200" y1="0" x2="200" y2="480" />
    <line x1="400" y1="0" x2="400" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" />
    <line x1="800" y1="0" x2="800" y2="480" />
    <line x1="1000" y1="0" x2="1000" y2="480" />
  </g>

  <!-- Pill Badge Superior (PARA Claude Code · Codex · Antigravity) -->
  <g transform="translate(600, 75)">
    <!-- Cápsula contenedor -->
    <rect x="-240" y="-19" width="480" height="38" rx="19" fill="#141419" fill-opacity="0.85" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.2" />
    
    <text text-anchor="middle" y="5" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="13" font-weight="600" fill="#9CA3AF" letter-spacing="2">
      <tspan fill="#6B7280" font-weight="700">PARA </tspan>
      <tspan fill="#F59E0B">✳️ Claude Code</tspan>
      <tspan fill="#4B5563"> • </tspan>
      <tspan fill="#38BDF8">🤖 Codex</tspan>
      <tspan fill="#4B5563"> • </tspan>
      <tspan fill="#F43F5E">🚀 Antigravity</tspan>
    </text>
  </g>

  <!-- TÍTULO NEÓN RETRO 3D: PASAPORTE -->
  <!-- Capa 3: Sombra profunda de extrusión 3D -->
  <text x="600" y="246" text-anchor="middle" font-family="'Silkscreen', 'Press Start 2P', 'Impact', 'Arial Black', sans-serif" font-size="106" font-weight="900" letter-spacing="10" fill="#400A00" opacity="0.9">
    PASAPORTE
  </text>
  <text x="600" y="242" text-anchor="middle" font-family="'Silkscreen', 'Press Start 2P', 'Impact', 'Arial Black', sans-serif" font-size="106" font-weight="900" letter-spacing="10" fill="#801500" opacity="0.95">
    PASAPORTE
  </text>
  <text x="600" y="238" text-anchor="middle" font-family="'Silkscreen', 'Press Start 2P', 'Impact', 'Arial Black', sans-serif" font-size="106" font-weight="900" letter-spacing="10" fill="#B32400">
    PASAPORTE
  </text>

  <!-- Capa 2: Resplandor Neón Naranja de Fondo -->
  <text x="600" y="234" text-anchor="middle" font-family="'Silkscreen', 'Press Start 2P', 'Impact', 'Arial Black', sans-serif" font-size="106" font-weight="900" letter-spacing="10" fill="#FF5500" filter="url(#neonGlow)" opacity="0.85">
    PASAPORTE
  </text>

  <!-- Capa 1: Texto Frontal con Gradiente Radiante Dorado/Naranja -->
  <text x="600" y="232" text-anchor="middle" font-family="'Silkscreen', 'Press Start 2P', 'Impact', 'Arial Black', sans-serif" font-size="106" font-weight="900" letter-spacing="10" fill="url(#neonGrad)" filter="url(#shadow3D)">
    PASAPORTE
  </text>

  <!-- Subtítulo Principal de Alto Impacto -->
  <text x="600" y="315" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
    Asistencia con IA y Códigos QR, <tspan fill="#FF7B25">desde tu terminal.</tspan>
  </text>

  <!-- Descripción secundaria -->
  <text x="600" y="360" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="16" font-weight="500" fill="#94A3B8" letter-spacing="0.2">
    Pase de lista gamificado con pasaportes digitales • Escáner ráfaga con confirmación por voz • Despliegue Zero-Code
  </text>

  <!-- Insignia inferior de autoría independiente -->
  <g transform="translate(600, 415)">
    <rect x="-210" y="-16" width="420" height="32" rx="16" fill="#121217" stroke="#FF7B25" stroke-opacity="0.35" stroke-width="1" />
    <text text-anchor="middle" y="5" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#CBD5E1">
      <tspan fill="#FF9A44">⚡ Creado por Salvador Almánzar</tspan>
      <tspan fill="#64748B"> • </tspan>
      <tspan fill="#10B981">Licencia MIT Oficial</tspan>
    </text>
  </g>
</svg>
